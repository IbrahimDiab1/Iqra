<iqra-reconnect-banner />

<div class="view">
  <router-outlet />
</div>

@if (showTabs()) {
  <nav class="tabbar" aria-label="Main">
    @for (tab of tabs; track tab.path) {
      <a class="tab" [routerLink]="tab.path" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="tab-icon" [innerHTML]="iconMarkup(tab.icon)"></span>
        <span>{{ tab.label }}</span>
        @if (tab.path === '/review' && due() > 0) {
          <span class="badge" data-testid="due-badge" [attr.aria-label]="dueLabel(due())">{{ due() > 99 ? '99+' : due() }}</span>
        }
      </a>
    }
  </nav>
}

<iqra-open-book-sheet />
<iqra-remove-book-sheet />
<iqra-book-details-sheet />
<f-toast />
